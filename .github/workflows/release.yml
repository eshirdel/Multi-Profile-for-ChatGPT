name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match VERSION
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match VERSION $v"; exit 1; }

      - name: Build release assets
        run: |
          set -euo pipefail
          mkdir -p dist/multi-profile-for-chatgpt
          cp -R bin lib install.sh VERSION LICENSE NOTICE README.md dist/multi-profile-for-chatgpt/
          tar --owner=0 --group=0 --sort=name -C dist -czf dist/multi-profile-for-chatgpt.tar.gz multi-profile-for-chatgpt
          (cd dist && sha256sum multi-profile-for-chatgpt.tar.gz > multi-profile-for-chatgpt.tar.gz.sha256)
          cp install.sh dist/install.sh
          cat dist/multi-profile-for-chatgpt.tar.gz.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/multi-profile-for-chatgpt.tar.gz \
            dist/multi-profile-for-chatgpt.tar.gz.sha256 \
            dist/install.sh \
            --title "$GITHUB_REF_NAME" --generate-notes
